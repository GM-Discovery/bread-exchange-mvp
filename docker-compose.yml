services:
  bread-exchange:
    build: .
    container_name: bread-exchange
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    expose:
      - "8787"
    environment:
      - NODE_ENV=production
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
    name: bread-poll-mvp_default
